# ============================================
#   ❀ BlossomEconomy 2.0 - Blossom SMP ❀
# ============================================
# Colours: &a, &d, &l ... and hex colours like &#FF69B4
# After editing, run: /eco reload

# Money every new player starts with
starting-balance: 500

# How often balances and market prices are saved (minutes)
autosave-minutes: 5

# Smallest amount allowed with /pay
min-pay: 1

# ----------------------------------------------
# Live market
# Selling an item lowers its price, buying it from /shop raises it.
# Prices slowly return to normal when nobody trades the item.
# ----------------------------------------------
market:
  # Shop buy price = normal price x this
  buy-multiplier: 3.0
  # How much ONE item sold/bought moves the price (0.001 = 0.1%, so a stack of 64 moves it about 6%)
  impact-per-item: 0.001
  # Lowest a price can drop to (% of normal)
  min-price-percent: 25
  # Highest a price can rise to (% of normal)
  max-price-percent: 300
  # Every recovery-minutes, prices move this % of the way back to normal
  recovery-percent: 5
  recovery-minutes: 5

# ----------------------------------------------
# Auction house (/ah)
# ----------------------------------------------
auction:
  title: "&#FF69B4&l❀ Auction House"
  # % of the sale price the server keeps
  tax-percent: 5
  # How many items one player can list at once
  max-listings: 5
  # How long listings last before they return to the seller
  duration-hours: 48
  min-price: 1
  max-price: 1000000000000

# ----------------------------------------------
# PvP kill rewards
# ----------------------------------------------
kill-rewards:
  enabled: true
  # Money the killer gets for every player kill
  amount: 50
  # Extra % of the victim's balance moved to the killer (0 = off)
  steal-percent: 0
  # Seconds before killing the SAME player pays again (stops kill farming)
  same-victim-cooldown: 300

# ----------------------------------------------
# Shop (/shop) - which items can be BOUGHT.
# Buy price comes from 'prices' below x buy-multiplier.
# Max 45 items per category.
# ----------------------------------------------
shop:
  title: "&#FF69B4&l❀ Blossom Shop"
  categories:
    blocks:
      name: "&#FF69B4&lBlocks"
      icon: CHERRY_LOG
      slot: 10
      items: [GRASS_BLOCK, DIRT, STONE, COBBLESTONE, COBBLED_DEEPSLATE, SMOOTH_STONE, STONE_BRICKS,
              SAND, RED_SAND, GRAVEL, CLAY, GLASS, BRICKS, TERRACOTTA, WHITE_WOOL, QUARTZ_BLOCK,
              MOSS_BLOCK, SNOW_BLOCK, PACKED_ICE, SEA_LANTERN, OAK_LOG, SPRUCE_LOG, BIRCH_LOG,
              JUNGLE_LOG, ACACIA_LOG, DARK_OAK_LOG, MANGROVE_LOG, CHERRY_LOG, CRIMSON_STEM,
              WARPED_STEM, CHERRY_LEAVES]
    farming:
      name: "&#FF69B4&lFarming"
      icon: WHEAT_SEEDS
      slot: 11
      items: [WHEAT_SEEDS, CARROT, POTATO, BEETROOT_SEEDS, MELON_SEEDS, PUMPKIN_SEEDS, SUGAR_CANE,
              CACTUS, BAMBOO, KELP, COCOA_BEANS, NETHER_WART, SWEET_BERRIES, GLOW_BERRIES, BONE_MEAL,
              BROWN_MUSHROOM, RED_MUSHROOM, OAK_SAPLING, SPRUCE_SAPLING, BIRCH_SAPLING,
              CHERRY_SAPLING, EGG]
    food:
      name: "&#FF69B4&lFood"
      icon: COOKED_BEEF
      slot: 12
      items: [APPLE, BREAD, BAKED_POTATO, COOKED_BEEF, COOKED_PORKCHOP, COOKED_CHICKEN,
              COOKED_MUTTON, COOKED_SALMON, COOKED_COD, PUMPKIN_PIE, CAKE, GOLDEN_CARROT, GOLDEN_APPLE]
    mobdrops:
      name: "&#FF69B4&lMob Drops"
      icon: BONE
      slot: 14
      items: [ROTTEN_FLESH, BONE, STRING, SPIDER_EYE, GUNPOWDER, SLIME_BALL, LEATHER, FEATHER,
              INK_SAC, ENDER_PEARL, BLAZE_ROD, GHAST_TEAR, PHANTOM_MEMBRANE, MAGMA_CREAM]
    combat:
