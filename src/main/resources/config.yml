# ============================================
#   ❀ BlossomEconomy - Blossom SMP ❀
# ============================================
# Colours: &a, &d, &l ... and hex colours like &#FF69B4
# After editing, run: /eco reload

# Money every new player starts with
starting-balance: 500

# How often balances are saved to disk (minutes)
autosave-minutes: 5

# Smallest amount allowed with /pay
min-pay: 1

# ----------------------------------------------
# PvP kill rewards
# ----------------------------------------------
kill-rewards:
  enabled: true
  # Money the killer gets for every player kill
  amount: 50
  # Extra % of the victim's balance moved to the killer (0 = off)
  steal-percent: 0
  # Seconds before killing the SAME player pays again (stops kill farming)
  same-victim-cooldown: 300

# ----------------------------------------------
# Shop (/shop)
# Prices are what players PAY for 1 item.
# Items in the shop can be sold back for (buy price x sell-ratio),
# unless they have their own price under sell-prices below.
