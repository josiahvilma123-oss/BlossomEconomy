      icon: ENDER_EYE
      slot: 16
      items: [NETHERRACK, SOUL_SAND, SOUL_SOIL, MAGMA_BLOCK, BASALT, BLACKSTONE, QUARTZ,
              GLOWSTONE_DUST, BLAZE_POWDER, END_STONE, CHORUS_FRUIT, SHULKER_SHELL]

